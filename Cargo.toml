[package]
name = "mdstore"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
description = "A file-based storage engine that stores structured data as Markdown files with YAML frontmatter"
authors = ["Centy Team"]
license-file = "LICENSE.md"
repository = "https://github.com/centy-io/mdstore"
homepage = "https://github.com/centy-io/mdstore"
documentation = "https://docs.rs/mdstore"
readme = "README.md"
keywords = ["markdown", "frontmatter", "storage", "yaml", "file-based"]
categories = ["database", "filesystem"]
exclude = [".github/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
gray_matter = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
slug = "0.1.6"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Enable pedantic lints
pedantic = { level = "warn", priority = -1 }

# Deny panic/unwrap/expect to enforce proper error handling
# Test code is exempted via cfg_attr(test, allow(...)) in lib.rs
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
exit = "deny"
# Deny `todo!()` placeholders, which panic at runtime if reached and would
# otherwise bypass the panic/unwrap/expect denials above.
todo = "deny"

# Deny `.map_err(|_| ...)` that discards the original error with a wildcard
# pattern. As a storage engine, mdstore wraps low-level I/O, parse and
# timestamp errors into its own error type; throwing away the underlying cause
# erases the detail a caller needs to diagnose a failure (e.g. *why* a
# timestamp or YAML payload was rejected). Bind the error and fold it into the
# new error's message or source instead. Extends the same "never lose error
# information" discipline as the panic/unwrap/expect denials above to error
# mapping.
map_err_ignore = "deny"
# Deny `unimplemented!()` placeholders. Like `todo!()`, this macro panics at
# runtime if reached, bypassing the panic/unwrap/expect denials above. It marks
# a code path the author never finished; shipping it in a storage engine turns a
# missing implementation into a hard panic for the consuming application. Return
# a proper `Error` variant instead.
unimplemented = "deny"

# Deny leftover `dbg!` debugging macros so stray debug output is never
# shipped in the library. Use the `tracing` crate for intentional logging.
dbg_macro = "deny"

# Deny `print!`/`println!` in library code. As a storage engine, mdstore must
# never write to the process's stdout — that channel belongs to the consuming
# application, which may rely on it for its own CLI output or piped data. Stray
# prints corrupt that stream and are invisible in structured logs. Use the
# `tracing` crate for diagnostics, mirroring the `dbg_macro` denial above.
print_stdout = "deny"

# Deny `eprint!`/`eprintln!` in library code, the companion to the
# `print_stdout` denial above. A storage engine must not write to the
# process's stderr either: that channel belongs to the consuming application,
# which may surface its own diagnostics or errors there, and stray library
# prints corrupt that stream while staying invisible to structured log
# collectors. Route all diagnostics through the `tracing` crate instead.
print_stderr = "deny"

# Deny unvalidated arithmetic to prevent overflow panics in debug
# and silent wrapping in release builds
arithmetic_side_effects = "deny"

# Deny direct indexing/slicing to prevent index-out-of-bounds panics
# Use safe alternatives like .get(), .first(), .split_at() which return Option
indexing_slicing = "deny"

# Deny direct string slicing (s[a..b]) which panics if a range boundary falls
# inside a multi-byte UTF-8 character. Use s.get(a..b) which returns Option.
string_slice = "deny"

# Deny verbose file reads: a manual `File::open(..)` followed by `read_to_end` /
# `read_to_string` is longer and easier to get wrong (forgotten buffer reuse,
# partial reads) than the one-shot `fs::read(..)` / `fs::read_to_string(..)`.
# As a file-based storage engine, mdstore reads files throughout (config.rs,
# reconcile.rs, storage.rs) and already uses the concise `fs::read_to_string`
# form. This lint locks that idiom in so no future code regresses to the
# verbose, error-prone open-then-read pattern.
verbose_file_reads = "deny"

# Deny `if cond { Some(x) } else { None }`, which reads as a branch but is only
# a boolean-to-Option conversion. Use `cond.then(|| x)` / `cond.then_some(x)` so
# the intent — "produce a value only when the condition holds" — is explicit and
# the value isn't buried inside an if/else.
if_then_some_else_none = "deny"

# Warn on long functions - enforces refactoring into smaller functions
too_many_lines = "deny"

# Deny redundant clones - flags `.clone()` whose result is never used,
# wasting a heap allocation/deep copy. Use the original value directly.
redundant_clone = "deny"

# Deny `.clone()` on reference-counted pointers (Arc/Rc/Weak). `x.clone()`
# only bumps the refcount, but reads like a potentially expensive deep clone.
# Require the explicit `Arc::clone(&x)` / `Rc::clone(&x)` form (already used in
# reconcile.rs and storage.rs) so a cheap refcount bump is never mistaken for a
# deep copy at a glance.
clone_on_ref_ptr = "deny"

# Deny `let _ = <#[must_use] expr>;`, which silently discards a value the
# compiler marked as must-use — most importantly a `Result`. Unlike the
# panic/unwrap denials above, this catches errors that are thrown away without
# any handling at all (no `?`, no match, no log), making a failed operation
# invisible. The fix is explicit: handle the `Result`, or annotate intent with
# `let _: () = ...` / `drop(...)` for genuinely ignorable must-use values.
let_underscore_must_use = "deny"

# Deny `mem::forget(value)`, which takes ownership of a value and skips running
# its `Drop` impl. In a file-based storage engine many owned values flush
# buffered writes, release file locks, close handles or remove temp files in
# `Drop`; forgetting one silently skips that cleanup, turning a "forgotten"
# value into data loss or a stuck lock with no error, panic or log. This extends
# the same never-fail-silently discipline as `let_underscore_must_use` above to
# destructors. No `mem::forget` calls exist today, so `deny` is a zero-violation
# guardrail; a rare legitimate leak (e.g. handing ownership to FFI) can opt out
# locally with `#[allow(clippy::mem_forget)]` plus a justifying comment.
mem_forget = "deny"

# Allow noisy pedantic lints
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
wildcard_imports = "allow"
return_self_not_must_use = "allow"
format_push_string = "allow"
wrong_self_convention = "allow"
too_many_arguments = "allow"
enum_variant_names = "allow"
assigning_clones = "allow"
missing_panics_doc = "allow"
default_trait_access = "allow"
const_is_empty = "allow"
manual_let_else = "allow"
unused_async = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
